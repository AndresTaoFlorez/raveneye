# compose.hub.yaml — for end users installing from Docker Hub.
# Uses the published image (andrestao577/raveneye) instead of building from source.
# The install script uses this file; developers use compose.yaml.

services:
  raveneye:
    image: andrestao577/raveneye:latest
    # Reap zombie Chromium child processes — without this they accumulate
    # until the container degrades.
    init: true
    environment:
      RAVENEYE_TARGET_URL: '${RAVENEYE_TARGET_URL:-http://127.0.0.1:8090/overview}'
      RAVENEYE_ALLOWED_HOSTS: '${RAVENEYE_ALLOWED_HOSTS:-host.docker.internal,localhost,127.0.0.1}'
      RAVENEYE_VIEWPORT_WIDTH: '${RAVENEYE_VIEWPORT_WIDTH:-1440}'
      RAVENEYE_VIEWPORT_HEIGHT: '${RAVENEYE_VIEWPORT_HEIGHT:-900}'
      RAVENEYE_PROFILE_MODE: '${RAVENEYE_PROFILE_MODE:-ephemeral}'
      RAVENEYE_RECORD_VIDEO: '${RAVENEYE_RECORD_VIDEO:-false}'
      RAVENEYE_RECORD_TRACE: '${RAVENEYE_RECORD_TRACE:-false}'
      RAVENEYE_MAX_SESSIONS: '${RAVENEYE_MAX_SESSIONS:-10}'
      RAVENEYE_SESSION_DISPLAY_START: '${RAVENEYE_SESSION_DISPLAY_START:-98}'
      RAVENEYE_SESSION_VNC_PORT_START: '${RAVENEYE_SESSION_VNC_PORT_START:-5901}'
      RAVENEYE_SESSION_NOVNC_PORT_START: '${RAVENEYE_SESSION_NOVNC_PORT_START:-6081}'
      RAVENEYE_SESSION_CDP_PORT_START: '${RAVENEYE_SESSION_CDP_PORT_START:-9223}'
    ports:
      - '127.0.0.1:${RAVENEYE_NOVNC_PORT:-6080}:6080'
      - '127.0.0.1:${RAVENEYE_CDP_PORT:-9222}:9222'
      - '127.0.0.1:${RAVENEYE_API_PORT:-8090}:8090'
      # Session ranges are mapped same:same — the app inside allocates listeners
      # starting at RAVENEYE_SESSION_*_PORT_START, so host and container must match.
      - '127.0.0.1:${RAVENEYE_SESSION_NOVNC_PORT_START:-6081}-${RAVENEYE_SESSION_NOVNC_PORT_END:-6100}:${RAVENEYE_SESSION_NOVNC_PORT_START:-6081}-${RAVENEYE_SESSION_NOVNC_PORT_END:-6100}'
      - '127.0.0.1:${RAVENEYE_SESSION_CDP_PORT_START:-9223}-${RAVENEYE_SESSION_CDP_PORT_END:-9232}:${RAVENEYE_SESSION_CDP_PORT_START:-9223}-${RAVENEYE_SESSION_CDP_PORT_END:-9232}'
    volumes:
      # Artifacts bind-mounted so the MCP server can read screenshots from the host.
      - ./artifacts:/artifacts:z
      - raveneye-profile:/browser-profile
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    shm_size: '2gb'
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    # Explicit healthcheck so a hung observer is reported as unhealthy even
    # when the pulled image predates the baked-in Dockerfile HEALTHCHECK.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8090/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  raveneye-profile:
